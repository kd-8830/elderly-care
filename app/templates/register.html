{% extends "base.html" %}
{% block title %}Register · ElderCare{% endblock %}
{% block content %}
  <section class="card auth-card">
    <h1>Create your account</h1>
    <p class="muted">
      You will get your own care profile. Family members and caretakers can join it later.
    </p>
    <form method="post" action="{{ url_for('auth.register') }}" class="form">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required
             value="{{ form.get('name', '') }}" autocomplete="name">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required
             value="{{ form.get('email', '') }}" autocomplete="email">

      <label for="passcode">Passcode (at least 4 characters)</label>
      <input id="passcode" name="passcode" type="password" required
             minlength="4" autocomplete="new-password">

      <label for="role">I am the...</label>
      <select id="role" name="role">
        <option value="elderly" {% if form.get('role') == 'elderly' %}selected{% endif %}>Elderly user (own profile)</option>
        <option value="caretaker" {% if form.get('role') == 'caretaker' %}selected{% endif %}>Caretaker</option>
        <option value="family" {% if form.get('role') == 'family' %}selected{% endif %}>Family member</option>
      </select>

      <button type="submit" class="btn btn-primary">Create account</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </section>
{% endblock %}
