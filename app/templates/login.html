{% extends "base.html" %}
{% block title %}Log in · ElderCare{% endblock %}
{% block content %}
  <section class="card auth-card">
    <h1>Log in</h1>
    <p class="muted">Use the email and passcode you registered with.</p>
    <form method="post" action="{{ url_for('auth.login') }}" class="form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required
             value="{{ form.get('email', '') }}" autocomplete="email">

      <label for="passcode">Passcode</label>
      <input id="passcode" name="passcode" type="password" required
             autocomplete="current-password">

      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="muted">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
  </section>
{% endblock %}
